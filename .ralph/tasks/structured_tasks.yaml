# Ralph Structured Task Definitions - MVP+ Phase

tasks:
  pwa_offline_mode:
    name: "PWA & Offline Mode"
    description: "Progressive Web App with offline track caching for mobile/DJ use"
    priority: "high"
    estimated_iterations: 3
    estimated_cost: 5.00
    
    subagent_prompt: >
      Implement PWA with offline track caching for pro users.
      
      Focus on:
      1. Service Worker registration and lifecycle
      2. Cache API for stream tracks and artwork
      3. manifest.json for installability (PWA)
      4. Offline indicator UI (go-offline class on body)
      5. Background Sync when back online
      
      Files to create/modify:
      - public/sw.js (Service Worker)
      - public/manifest.json (PWA manifest)
      - public/js/offline.js (offline detection)
      - views/layout.templ (add manifest link, offline detection)
      - public/css/custom.css (offline indicator styles)
      
      Requirements:
      - Cache tracks from /stream for offline playback
      - Cache artwork images
      - Show clear offline indicator when disconnected
      - Sync when connection restored
      - Installable on mobile (touch-capable) and desktop
      - Follow PWA best practices
      
      Do NOT:
      - Break existing functionality
      - Cache too much data (limit to last 50 tracks)
      - Cache authentication tokens (security)
      
      Success Criteria:
      - [ ] /manifest.json returns valid PWA manifest
      - [ ] /sw.js registers successfully
      - [ ] App works offline (cached content loads)
      - [ ] Offline indicator shows when disconnected
      - [ ] Can be "Add to Home Screen" on mobile

    dependencies: []
    
    success_criteria:
      - name: "PWA Installability"
        description: "App can be installed as PWA on mobile/desktop"
        verification: "pwa_install_test"
        
      - name: "Offline Track Access"
        description: "Cached tracks playable without internet"
        verification: "offline_playback_test"

  data_export:
    name: "Data Export"
    description: "Export favorites and playlists as JSON/CSV for pro users"
    priority: "medium"
    estimated_iterations: 2
    estimated_cost: 3.00
    
    subagent_prompt: >
      Implement data export functionality for pro users who own their data.
      
      Focus on:
      1. Export favorites as JSON
      2. Export favorites as CSV
      3. Export playlists as JSON
      4. Download buttons in UI
      
      Routes to implement:
      - GET /api/export/favorites/json
      - GET /api/export/favorites/csv
      - GET /api/export/playlists/json
      
      Components:
      - Add export buttons to /favorites page
      - Add export buttons to /playlists page (future)
      
      Requirements:
      - Include track metadata (title, artist, genre, duration, link)
      - Proper content-disposition headers for download
      - Filename includes date (e.g., favorites-2026-02-20.json)
      - CSV with proper escaping
      - Auth required for export
      
      Dependencies:
      - Favorites system must be working

    dependencies: ["oauth_implementation", "stream_display"]
    
    success_criteria:
      - name: "JSON Export"
        description: "Export favorites as valid JSON file"
        verification: "json_export_test"
        
      - name: "CSV Export"
        description: "Export favorites as CSV spreadsheet"
        verification: "csv_export_test"

  playlist_system:
    name: "Playlist System"
    description: "Create, manage, and share playlists from stream/favorites"
    priority: "medium"
    estimated_iterations: 3
    estimated_cost: 4.00
    
    subagent_prompt: >
      Implement playlist management for pro users to curate music.
      
      Focus on:
      1. Create new playlist (name, description)
      2. Add tracks from stream/favorites to playlist
      3. Reorder tracks within playlist
      4. Delete playlists
      5. Share playlist as link
      
      Database:
      - Create playlists collection in PocketBase
      - playlist_tracks junction table for ordering
      
      Routes to implement:
      - GET /playlists (list all playlists)
      - POST /api/playlists (create playlist)
      - GET /playlists/:id (view playlist)
      - POST /api/playlists/:id/tracks (add track)
      - PUT /api/playlists/:id/tracks/reorder (reorder)
      - DELETE /api/playlists/:id (delete)
      - GET /share/:playlist_id (public share link)
      
      UI Components:
      - views/playlists.templ (list page)
      - views/playlist_show.templ (single playlist)
      - Add "Add to Playlist" button on track cards
      
      Requirements:
      - Maximum 20 playlists per user
      - Maximum 500 tracks per playlist
      - Share link shows public track list (Soundcloud links)
      - Drag-and-drop reordering
      
      Dependencies:
      - Stream display must be working
      - Favorites system must be working

    dependencies: ["oauth_implementation", "stream_display", "favorites_system"]
    
    success_criteria:
      - name: "Create Playlist"
        description: "Users can create named playlists"
        verification: "create_playlist_test"
        
      - name: "Add Tracks"
        description: "Users can add tracks from stream/favorites"
        verification: "add_tracks_test"
        
      - name: "Share Playlist"
        description: "Users can share playlist via public link"
        verification: "share_playlist_test"

  listening_analytics:
    name: "Listening Analytics"
    description: "Track play history and show listening insights"
    priority: "low"
    estimated_iterations: 2
    estimated_cost: 3.00
    
    subagent_prompt: >
      Implement local analytics for pro users to understand their listening.
      
      Focus on:
      1. Track play history in localStorage
      2. Most played tracks (top 10)
      3. Most played artists
      4. Genre distribution
      5. Listening time stats
      
      Components:
      - /analytics page with charts
      - Local storage for play history
      - Simple bar charts (CSS-based, no heavy libs)
      
      Requirements:
      - All data stored locally (privacy)
      - No external analytics
      - Clear "no data yet" state
      - Responsive charts
      
      Dependencies:
      - Stream display must be working

    dependencies: ["stream_display"]
    
    success_criteria:
      - name: "Play History"
        description: "Track which tracks users play"
        verification: "play_history_test"
        
      - name: "Analytics Display"
        description: "Show top tracks, artists, genres"
        verification: "analytics_display_test"

  rss_feed:
    name: "RSS Feed (Share Only)"
    description: "Generate RSS feed URL for sharing with podcast apps"
    priority: "low"
    estimated_iterations: 1
    estimated_cost: 1.50
    
    subagent_prompt: >
      Implement RSS feed generation for sharing streams.
      
      Focus on:
      1. Generate RSS feed URL for user
      2. Include track metadata (title, artist, genre, duration)
      3. Link to Soundcloud for playback
      4. Share button on stream page
      
      Routes:
      - GET /feed/rss (authenticated user's feed)
      - GET /feed/rss/:share_token (public share feed)
      
      Requirements:
      - Standard RSS 2.0 format
      - iTunes podcast extensions for artwork
      - Link to Soundcloud for each track
      - Share token for public access (not authenticated)
      
      Dependencies:
      - Stream display must be working

    dependencies: ["stream_display"]
    
    success_criteria:
      - name: "RSS Generation"
        description: "Valid RSS feed with track metadata"
        verification: "rss_generation_test"
        
      - name: "RSS Sharing"
        description: "Public share link works"
        verification: "rss_share_test"

# Legacy Tasks (MVP - already complete)
  oauth_implementation:
    name: "OAuth Authentication Implementation"
    description: "Complete Soundcloud OAuth 2.1 flow with PKCE support"
    priority: "high"
    estimated_iterations: 3
    estimated_cost: 4.50
    status: "completed"
    
  stream_display:
    name: "Stream Display Implementation"
    description: "Build main stream view showing Soundcloud tracks chronologically"
    priority: "high"
    estimated_iterations: 2
    estimated_cost: 3.00
    status: "completed"

# Global Configuration
completion_promise: "Pro users can access their Soundcloud stream offline via PWA, export their data, and create playlists"

cost_limits:
  total: 25.00
  per_task:
    pwa_offline_mode: 5.00
    data_export: 3.00
    playlist_system: 4.00
    listening_analytics: 3.00
    rss_feed: 1.50
  buffer: 8.50

iteration_limits:
  total: 40
  per_task:
    pwa_offline_mode: 5
    data_export: 4
    playlist_system: 5
    listening_analytics: 4
    rss_feed: 3

escalation_policy:
  hint_after_iterations: 3
  alternative_approach_after: 5
  human_intervention_after: 7
project:
  name: "sound-cistern"
  description: "Soundcloud stream aggregator with PocketBase for Pro/Music Industry users"
  tech_stack: ["go", "pocketbase", "templ", "htmx"]
  base_url: "http://localhost:8090"

ralph_loop:
  max_iterations: 30
  cost_limit: 20.00
  completion_promise: "Pro users can access their Soundcloud stream offline via PWA, export their data, and create playlists"
  
  tasks:
    current: "pwa-offline-mode"
    success_criteria:
      - name: "PWA Installability"
        description: "App can be installed as PWA on mobile/desktop"
        verification: "pwa_install_test"
        test_url: "/"
      - name: "Offline Track Access"
        description: "Cached tracks playable without internet"
        verification: "offline_playback_test"
        test_url: "/stream"
      - name: "Data Export"
        description: "Users can export favorites/playlists as JSON/CSV"
        verification: "data_export_test"
        test_url: "/favorites"
      - name: "Playlist System"
        description: "Users can create, manage, and share playlists"
        verification: "playlist_test"
        test_url: "/playlists"

verification_scripts:
  pwa_install_test: "./ralph_verify.sh pwa_install"
  offline_playback_test: "./ralph_verify.sh offline_playback"
  data_export_test: "./ralph_verify.sh data_export"
  playlist_test: "./ralph_verify.sh playlist"
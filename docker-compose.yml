# Docker Compose for Sound Cistern (PocketBase)
# Note: PocketBase uses embedded SQLite, no external database needed

version: '3.8'

services:
  app:
    build: .
    container_name: sound_cistern
    ports:
      - "8090:8090"
    volumes:
      # Persist PocketBase data
      - pb_data:/app/pb_data
      # Optional: mount local public assets for development
      # - ./public:/app/public
    environment:
      # PocketBase runs in production mode by default
      # Add --dev flag in command for development mode
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pb_data:
    driver: local

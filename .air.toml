root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["serve", "--dev", "--dir=pb_data", "--http=0.0.0.0:8090"]
  bin = "./tmp/sound-cistern"
  cmd = "templ generate && CGO_ENABLED=0 go build -o ./tmp/sound-cistern"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs", "specs", ".git", ".specify"]
  exclude_file = []
  exclude_regex = ["_test.go", "_templ.go$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "templ", "css"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

openapi: 3.0.0
info:
  title: Sound Cistern Feed
  version: 1.0.0
  description: PocketBase routes for feed display and filtering (HTMX + JSON)
paths:
  /feed:
    get:
      summary: Render user's Soundcloud feed (HTML)
      description: Custom PocketBase route (registered in main.go), renders views/feed.templ
      security:
        - cookieAuth: []
      responses:
        '200':
          description: HTML page with feed
          content:
            text/html:
              schema:
                type: string
  /api/feed:
    get:
      summary: Get user's Soundcloud feed (JSON)
      description: Custom PocketBase route for API access
      security:
        - cookieAuth: []
      responses:
        '200':
          description: JSON list of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
  /api/feed/filter:
    post:
      summary: Filter feed by criteria (HTMX target)
      description: Custom PocketBase route, returns HTML fragment for HTMX swap
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FilterCriteria'
      responses:
        '200':
          description: HTML fragment with filtered tracks
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    Track:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        length:
          type: integer
        genre:
          type: string
        post_time:
          type: string
          format: date-time
    FilterCriteria:
      type: object
      properties:
        min_length:
          type: integer
        max_length:
          type: integer
        genres:
          type: array
          items:
            type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        query:
          type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pb_auth
      description: PocketBase session cookie